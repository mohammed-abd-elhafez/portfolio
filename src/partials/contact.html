<section class="contact" id="contact" aria-labelledby="contact-h">
  <h2 id="contact-h">{{t.contactTitle}}</h2>
  <p class="lede">{{t.contactLede}}</p>
  <div class="mail-row">
    <a class="mail" href="{{mail}}" dir="ltr">{{site.email}}</a>
    <button class="btn copy" type="button" data-copy="{{site.email}}" data-done="{{t.copied}}">{{t.copy}}</button>
  </div>
  <p class="contact-alt"><a href="{{site.social.github}}" target="_blank" rel="noopener">{{t.githubLabel}}</a></p>
</section>
