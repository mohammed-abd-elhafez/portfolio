<!doctype html>
<html lang="{{t.lang}}" dir="{{t.dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{t.navAbout}} · {{t.name}}</title>
  <meta name="description" content="{{t.description}}">
  <meta property="og:title" content="{{t.navAbout}} · {{t.name}}">
  <meta property="og:description" content="{{t.description}}">
  <!-- @include head-common -->
</head>
<body data-page="about">
  <!-- @include chrome -->

  <main id="main" class="case about">
    <header class="case-head">
      <h1>{{t.aboutTitle}}</h1>
    </header>
    <section class="block"><h2>{{t.navAbout}}</h2><div class="prose"><p>{{t.aboutP1}}</p><p>{{t.aboutP2}}</p></div></section>
    <section class="block"><h2>{{t.aboutDoTitle}}</h2><div class="prose"><ul class="plain"><li>{{t.aboutDo1}}</li><li>{{t.aboutDo2}}</li><li>{{t.aboutDo3}}</li><li>{{t.aboutDo4}}</li></ul></div></section>
    <!-- @include contact -->
  </main>

  <!-- @include footer -->
</body>
</html>
