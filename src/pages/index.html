<!doctype html>
<html lang="{{t.lang}}" dir="{{t.dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{t.name}} · {{t.title}}</title>
  <meta name="description" content="{{t.description}}">
  <meta property="og:title" content="{{t.name}} · {{t.title}}">
  <meta property="og:description" content="{{t.description}}">
  <!-- @include head-common -->
</head>
<body data-page="home">
  <!-- @include chrome -->

  <main id="main">
    <section class="stage" aria-labelledby="hero-h">
      <div class="stage-copy">
        <h1 id="hero-h">{{t.heroTitle}}</h1>
        <p class="lede">{{t.heroLede}}</p>
      </div>

      <div class="gallery" data-gallery>
        <canvas class="gl" aria-hidden="true"></canvas>
        <ul class="strip" aria-label="{{t.workTitle}}">{{{fallbackSlides}}}</ul>
        <div class="gallery-ui" role="group" aria-roledescription="carousel" aria-label="{{t.galleryLabel}}" tabindex="0">
          <p class="caption" aria-live="polite">
            <span class="cap-n" dir="ltr"></span>
            <a class="cap-title" href="#"></a>
            <span class="cap-sub"></span>
          </p>
          <div class="ctrls">
            <span class="hint">{{t.galleryHint}}</span>
            <button class="round" type="button" data-step="-1" aria-label="{{t.prev}}"><svg class="ico flip" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H5M9 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <button class="round" type="button" data-step="1" aria-label="{{t.next}}"><svg class="ico flip" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <a class="btn btn-solid open" href="#">{{t.open}}</a>
          </div>
        </div>
        <script type="application/json" id="gallery-data">{{{galleryData}}}</script>
      </div>
    </section>

    <section class="work" id="work" aria-labelledby="work-h">
      <div class="sec-head">
        <h2 id="work-h">{{t.workTitle}}</h2>
        <p class="lede">{{t.workLede}}</p>
      </div>
      <ol class="work-list">
{{{workRows}}}
      </ol>
    </section>

    <section class="how" aria-labelledby="how-h">
      <h2 id="how-h">{{t.howTitle}}</h2>
      <ol class="how-line">
        <li><h3>{{t.how1t}}</h3><p>{{t.how1}}</p></li>
        <li><h3>{{t.how2t}}</h3><p>{{t.how2}}</p></li>
        <li><h3>{{t.how3t}}</h3><p>{{t.how3}}</p></li>
      </ol>
    </section>

    <!-- @include contact -->
  </main>

  <!-- @include footer -->
</body>
</html>
